<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        /* Top Welcome Bar */
        .header {
            background: linear-gradient(to right, #dc4011, #ff2e63);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        /* Middle Section */
        .content {
            background: linear-gradient(to right, #1e3c72, #11377a);
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin-top: 20px;
        }

        .content h1 {
            margin-bottom: 15px;
        }

        .content p {
            width: 70%;
            margin: auto;
            line-height: 1.6;
        }

        .content img {
            margin-top: 20px;
            width: 150px;
        }

        /* Bottom Section */
        .footer {
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

    </style>
</head>
<body>
   <div class="container">
        
        <div class="header">
            WELCOME
        </div>

        <div class="content">
            <h1>Heading 1</h1>
            <p>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                Maecenas porttitor congue massa. Fusce posuere, magna sed
                pulvinar ultricies, purus lectus malesuada libero.
            </p>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGhgvOMsyOkUHvU0lJFSeMixcNbjfZvZYfQyzp3dtW7w&s=10" alt="">
        </div>

        <div class="footer">
            Heading 2
        </div>

    </div>

 
</body>
</html>
